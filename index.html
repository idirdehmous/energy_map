<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Energy interactive map</title>

  <link rel="stylesheet"  href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet"  href="css/style_01.css" > 



</head>


<header class="topbar">
    <!-- Logo --> 
   <div class="topbar-left">
        <img src="./img/logo.png" alt="title" class="topbar-logo">
    </div>


    <!-- Application -->
    <div class="topbar-center">   
    <div class="app-subtitle"> People's Democratic Republic Of Algeria </div> 
    <div class="minister"  >   Ministry Of Energy And Renewable Energies  </div>   
    <div class="app-name"  >   Carte interactive </div > 
</header>





<div class="carte-et-fiche">

  <div id="map"></div>


  <aside class="panneau-fiches">
    <h2 id="titre-wilaya">Clique sur une wilaya</h2>
    
    
    
	   <!-- Tab links -->
    <div class="tab">
      <button class="tablinks active" onclick="openTab(event, 'tab-tableau')">Tableau</button>   
      <button class="tablinks"        onclick="openTab(event, 'tab-pec')">Programmes (PEC)</button>
      <button class="tablinks"        onclick="openTab(event, 'tab-histograms')">Histogrammes</button>
    </div>
 
    <!-- Tab 1: Properties -->
    <section id="tab-tableau" class="tabcontent">
     <h3 id="titre-pec">Tableau pour la wilaya selectionée </h3>
      <table id="table-wilaya" hidden>
        <tbody></tbody>
      </table>
    </section>



    <!-- Tab 3: PEC Table -->
    <section id="tab-pec" class="tabcontent" style="display: none;">
      <h3 id="titre-pec">Situation PEC</h3>
      <table id="table-wilaya-pec" hidden>
        <tbody></tbody>
      </table>
    </section>
  
<section id="tab-histograms" class="tabcontent" style="display: none;">
  <!-- 1. Toolbar (closes right after button) -->
  <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
    <label for="metric-select" style="font-weight: 600; font-size: 13px;">Indicateur :</label>
    <select id="metric-select" onchange="changeMetric(this.value)" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; flex: 1;">
      <option value="TAG" selected>TAG (%) — Taux d'Accès au Gaz</option>
      <option value="TAE">TAE (%) — Taux d'Accès à l'Électricité</option>
      <option value="TPG">TPG (%) — Taux de Pénétration Gaz</option>
      <option value="NAE">NAE — Nombre d'Abonnés Électricité</option>
      <option value="NAG">NAG — Nombre d'Abonnés Gaz</option>
    </select>
    <button id="sort-btn" onclick="toggleSort()" title="Changer l'ordre de tri" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-size: 12px; white-space: nowrap;">
      Trier valeurs décroissante
    </button>
  </div>

  <!-- 2. Dynamic Legend -->
  <div id="chart-legend" class="chart-legend"></div>

  <!-- 3. Scrollable Chart Container -->
  <div id="chart-scroll-box" style="height: 450px; overflow-y: auto; border: 1px solid #eee; padding: 8px;">
    <div style="position: relative; height: 1500px; width: 100%;">
      <canvas id="chart-wilaya"></canvas>
    </div>
  </div>
</section>
  
  
  

</section>
    

    
    
    
  </aside>
</div>





  <!--<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>-->
  <script src="./plugins/leaflet.js"></script>
  
  
 <!-- <script src="https://jsdelivr.net"></script>-->
 <script src="./plugins/chart.umd.min.js" defer></script>
  <script src="./js/app.js"></script>
</body>
</html>
